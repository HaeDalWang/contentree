global:
  nodeSelector:
    role: infra
server:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
    - dev-mkube-argocd.joins.seungdobae.com
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  env:
  - name: HTTP_PROXY
    value: http://dev-mkube-proxy.joins.seungdobae.com:3128
  - name: HTTPS_PROXY
    value: http://dev-mkube-proxy.joins.seungdobae.com:3128
  - name: NO_PROXY
    value: argocd-repo-server,argocd-application-controller,argocd-metrics,argocd-server,argocd-server-metrics,argocd-redis,argocd-dex-server,10.233.0.0/16,dev-mkube-harbor.joins.seungdobae.com,dev-mkube-keycloak.joins.seungdobae.com,k8s-harbor.joins.seungdobae.com,jlab.joongang.co.kr
repoServer:
  env:
  - name: HTTP_PROXY
    value: http://dev-mkube-proxy.joins.seungdobae.com:3128
  - name: HTTPS_PROXY
    value: http://dev-mkube-proxy.joins.seungdobae.com:3128
  - name: NO_PROXY
    value: argocd-repo-server,argocd-application-controller,argocd-metrics,argocd-server,argocd-server-metrics,argocd-redis,argocd-dex-server,10.233.0.0/16,dev-mkube-harbor.joins.seungdobae.com,dev-mkube-keycloak.joins.seungdobae.com,k8s-harbor.joins.seungdobae.com,jlab.joongang.co.kr
dex:
  env:
  - name: HTTP_PROXY
    value: http://dev-mkube-proxy.joins.seungdobae.com:3128
  - name: HTTPS_PROXY
    value: http://dev-mkube-proxy.joins.seungdobae.com:3128
  - name: NO_PROXY
    value: argocd-repo-server,argocd-application-controller,argocd-metrics,argocd-server,argocd-server-metrics,argocd-redis,argocd-dex-server,10.233.0.0/16,dev-mkube-harbor.joins.seungdobae.com,dev-mkube-keycloak.joins.seungdobae.com,k8s-harbor.joins.seungdobae.com,jlab.joongang.co.kr
configs:
  params:
    "server.insecure": true
  cm:
    url: https://dev-mkube-argocd.joins.seungdobae.com
    oidc.config: |
      name: Keycloak
      issuer: https://dev-mkube-keycloak.joins.seungdobae.com/realms/master
      clientID: argocd
      clientSecret: $oidc.keycloak.clientSecret
      requestedScopes: ["openid", "profile", "email", "user"]
  secret:
    argocdServerAdminPassword: $2a$10$8zswoW14GECMF2aFLryBbOMkSCdSDqpY6w5iCNZC.BYUrrI56zu9K
   #argocdServerAdminPasswordMtime: "2006-01-02T15:04:05Z" #all token expire if not use when refresh argocd
    extra:
      oidc.keycloak.clientSecret: SGwDAuvSlIPc2BwLniaZgV4SVjENGkfR
  rbac:
    policy.csv: |
      p, role:frontend, applications, get, frontend/*, allow
      p, role:frontend, applications, sync, frontend/*, allow
      p, role:frontend, logs, get, frontend/*, allow
      p, role:frontend, exec, create, frontend/*, allow
      p, role:frontend, projects, get, frontend, allow
      g, frontend, role:frontend
      p, role:viewer, applications, get, */*, allow
      g, viewer, role:viewer

notifications:
  argocdUrl: https://dev-mkube-argocd.joins.seungdobae.com
  extraEnv:
  - name: HTTP_PROXY
    value: http://dev-mkube-proxy.joins.seungdobae.com:3128
  - name: HTTPS_PROXY
    value: http://dev-mkube-proxy.joins.seungdobae.com:3128
  - name: NO_PROXY
    value: argocd-repo-server,argocd-application-controller,argocd-metrics,argocd-server,argocd-server-metrics,argocd-redis,argocd-dex-server,10.233.0.0/16,dev-mkube-harbor.joins.seungdobae.com,dev-mkube-keycloak.joins.seungdobae.com,k8s-harbor.joins.seungdobae.com
  secret:
    items:
      slack-token: ""  # 배포 시 Slack Bot Token 설정 (시크릿 노출 방지)
  notifiers:
    service.slack: |
      token: $slack-token
  triggers:
    trigger.on-sync-status-unknown: |
      - description: Application status is 'Unknown'
        send:
        - app-sync-status-unknown
        when: app.status.sync.status == 'Unknown'
    trigger.on-health-degraded: |
      - description: Application has degraded
        send:
        - app-health-degraded
        when: app.status.health.status == 'Degraded'    
    trigger.on-sync-failed: |
      - description: Application syncing has failed
        send:
        - app-sync-failed
        when: app.status.operationState.phase in ['Error', 'Failed']
    trigger.on-deployed: |
      - description: Application is synced and healthy. Triggered once per commit.
        oncePer: app.status.sync.revision
        send:
        - app-deployed
        when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
  subscriptions:
  - recipients:
    - slack:jcon-mkube-dev-deploy
    triggers:
    - on-sync-status-unknown
    - on-health-degraded
    - on-sync-failed
  templates:
    template.app-sync-status-unknown: |
      email:
        subject: Application {{.app.metadata.name}} sync status is 'Unknown'
      message: |
        {{if eq .serviceType "slack"}}:exclamation:{{end}} Application {{.app.metadata.name}} sync is 'Unknown'.
        Application details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}.
        {{if ne .serviceType "slack"}}
        {{range $c := .app.status.conditions}}
            * {{$c.message}}
        {{end}}
        {{end}}
      slack:
        attachments: |-
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#E96D76",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Repository",
              "value": "{{.app.spec.source.repoURL}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
    template.app-health-degraded: |
      email:
        subject: Application {{.app.metadata.name}} has degraded.
      message: |
        {{if eq .serviceType "slack"}}:exclamation:{{end}} Application {{.app.metadata.name}} has degraded.
        Application details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}.
      slack:
        attachments: |-
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#f4c030",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Repository",
              "value": "{{.app.spec.source.repoURL}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
    template.app-sync-failed: |
      email:
        subject: Failed to sync application {{.app.metadata.name}}.
      message: |
        {{if eq .serviceType "slack"}}:exclamation:{{end}}  The sync operation of application {{.app.metadata.name}} has failed at {{.app.status.operationState.finishedAt}} with the following error: {{.app.status.operationState.message}}
        Sync operation details are available at: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}?operation=true .
      slack:
        attachments: |-
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#E96D76",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Repository",
              "value": "{{.app.spec.source.repoURL}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
    template.app-deployed: |
      email:
        subject: New version of an application {{.app.metadata.name}} is up and running.
      message: |
        {{if eq .serviceType "slack"}}:white_check_mark:{{end}} Application {{.app.metadata.name}} is now running new version of deployments manifests.
      slack:
        attachments: |
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#18be52",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Repository",
              "value": "{{.app.spec.source.repoURL}}",
              "short": true
            },
            {
              "title": "Revision",
              "value": "{{.app.status.sync.revision}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]

