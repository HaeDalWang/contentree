# cluster-admin 권한이 명시된 kubeconfig파일을 아래의 경로로 admin.conf라는 이름으로 생성 
kubeconfig_localhost: true
artifacts_dir: /kubespray/artifacts
unsafe_show_logs: true

# Kubernetes 1.29 설치 (업그레이드 POC 시작 버전)
kube_version: v1.29.9
calico_version: v3.27.3
containerd_version: 1.7.22

# 클러스터 설정
kube_network_plugin: calico
kube_proxy_mode: ipvs

# Calico CNI 설정
calico_ipip_mode: Always
calico_vxlan_mode: Never
calico_network_backend: bird
kube_service_addresses: 10.233.0.0/18
kube_pods_subnet: 10.233.64.0/18
kube_network_node_prefix: 24

# 인증서 자동 갱신
auto_renew_certificates: true
auto_renew_certificates_systemd_calendar: "{{ 'Mon *-*-1,2,3,4,5,6,7 10:' ~
  groups['kube_control_plane'].index(inventory_hostname) ~ '0:00' }}"

# 사용하지 않는 컨테이너 이미지 정리
# https://kubernetes.io/docs/concepts/architecture/garbage-collection/#containers-images
kubelet_image_gc_low_threshold: 60
kubelet_image_gc_high_threshold: 70

# API 서버 주소 (kubeconfig server)
# LB 없을 때(POC): CP 한 대 IP만 지정. LB 있을 때(HA): VIP 지정
apiserver_loadbalancer_domain_name: 10.150.46.16
loadbalancer_apiserver:
  address: 10.150.46.16

####################################################
# Hardening

# kube-apiserver
authorization_modes: 
- Node
- RBAC
kube_apiserver_request_timeout: 120s
kube_apiserver_service_account_lookup: true

# CIS 1.2.1 - false로 할 경우에는 kubeadmin join 명령어실패
kube_api_anonymous_auth: true

# CIS 4.2.10
kube_hostname_override: false

# enable kubernetes audit
kubernetes_audit: true
audit_log_path: /var/log/kube-apiserver-log.json
audit_log_maxage: 30
audit_log_maxbackups: 10
audit_log_maxsize: 100

tls_min_version: VersionTLS12
tls_cipher_suites:
- TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
- TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
- TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305

# enable encryption at rest
kube_encrypt_secret_data: true
kube_encryption_resources: 
- secrets
kube_encryption_algorithm: secretbox

kube_apiserver_enable_admission_plugins:
- EventRateLimit
- AlwaysPullImages
- ServiceAccount
- NamespaceLifecycle
- NodeRestriction
- LimitRanger
- ResourceQuota
- MutatingAdmissionWebhook
- ValidatingAdmissionWebhook
- PodNodeSelector
kube_apiserver_admission_control_config_file: true

# EventRateLimit plugin configuration
kube_apiserver_admission_event_rate_limits:
  limit_1:
    type: Namespace
    qps: 50
    burst: 100
    cache_size: 2000
  limit_2:
    type: User
    qps: 50
    burst: 100
kube_profiling: false

## kube-controller-manager
kube_controller_manager_bind_address: 0.0.0.0
kube_controller_terminated_pod_gc_threshold: 50
kube_controller_feature_gates: 
- RotateKubeletServerCertificate=true

## kube-scheduler (profiling은 kube_profiling로 통일, extra_args에 넣으면 kubeadm v1beta3에서 중복 키 오류)
kube_scheduler_bind_address: 0.0.0.0

## kube-proxy
kube_proxy_metrics_bind_address: 0.0.0.0:10249

## etcd
etcd_metrics_port: 2381
etcd_deployment_type: kubeadm
# listen-metrics-urls: 노드별 IP 시 첫 CP IP(10.150.46.16)가 cp02/cp03에 적용되어 bind 실패 → 0.0.0.0으로 통일
etcd_extra_vars:
  listen-metrics-urls: "http://0.0.0.0:{{ etcd_metrics_port }}"
etcd_quota_backend_bytes: 8589934592

## kubelet
kubelet_authorization_mode_webhook: true
kubelet_authentication_token_webhook: true
kube_read_only_port: 0
kubelet_rotate_server_certificates: true
kubelet_csr_approver_values:
  bypassDnsResolution: true
kubelet_protect_kernel_defaults: true
kubelet_event_record_qps: 1
kubelet_rotate_certificates: true
kubelet_streaming_connection_idle_timeout: 5m
kubelet_make_iptables_util_chains: true
kubelet_feature_gates: 
- RotateKubeletServerCertificate=true
kubelet_seccomp_default: true
kubelet_systemd_hardening: false

# additional configurations
kube_owner: root
kube_cert_group: root

# create a default Pod Security Configuration and deny running of insecure pods
# kube_system namespace is exempted by default
kube_pod_security_use_default: true
kube_pod_security_default_enforce: restricted
kube_pod_security_exemptions_namespaces:
- kube-system
- ingress-nginx
- rook-ceph
- argocd
- prometheus
- elasticsearch
- fluent-bit
- fluent-bit-new
- x509-certificate-exporter
- sandbox
- ns-for-restore
- loki-stack
- event-exporter  
- auto-csr-approver 
- envoy-gateway-system

# Hardening (AWS에서는 무시)
