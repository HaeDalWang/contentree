# POC 인벤토리 — 인벤토리 호스트명/대역 k8s 분석과 동일: CP 3, Worker 3, Ingress 1
# Terraform: terraform-contentree-1.29 (노드 이름 mvd-kubecp01~03, mvd-kubewk01~03, mvd-kubert01)
all:
  vars:
    ansible_port: 22
    ansible_user: ubuntu
    ansible_become: yes
    ansible_hostname: "{{ inventory_hostname }}"
  hosts:
    mvd-kubecp01:
      ansible_host: 10.150.46.16
    mvd-kubecp02:
      ansible_host: 10.150.46.17
    mvd-kubecp03:
      ansible_host: 10.150.46.18
    mvd-kubewk01:
      ansible_host: 10.150.46.19
    mvd-kubewk02:
      ansible_host: 10.150.46.20
    mvd-kubewk03:
      ansible_host: 10.150.46.21
    mvd-kubert01:
      ansible_host: 10.150.44.16
      ip: 10.150.44.16
  children:
    kube_control_plane:
      hosts:
        mvd-kubecp01:
        mvd-kubecp02:
        mvd-kubecp03:
    kube_worker:
      hosts:
        mvd-kubewk01:
        mvd-kubewk02:
        mvd-kubewk03:
      vars:
        node_labels:
          role: worker
          node-role.kubernetes.io/worker: ""
    kube_router:
      hosts:
        mvd-kubert01:
      vars:
        node_labels:
          role: router
          node-role.kubernetes.io/router: ""
    etcd:
      children:
        kube_control_plane:
    kube_node:
      children:
        kube_worker:
        kube_router:
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
